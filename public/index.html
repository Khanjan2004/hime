<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocabulary Quiz Testing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100">
  <div class="max-w-6xl mx-auto p-4 md:p-8">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-300">Vocabulary Quiz Testing</h1>
        <p class="text-slate-300">Dark theme, code-based tests, upload mode, and admin statistics panel</p>
      </div>
      <button id="themeBtn" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-600">🌙 / ☀️</button>
    </header>

    <section id="menu" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <button data-open="uploadPanel" class="md:col-span-2 rounded-2xl p-8 bg-gradient-to-r from-indigo-600 to-purple-600 text-left shadow-lg hover:scale-[1.01] transition">
        <div class="text-2xl font-bold mb-2">📤 User Upload Test</div>
        <div class="text-indigo-100">Upload your own vocabulary list and start instantly (no admin needed).</div>
      </button>

      <button data-open="codePanel" class="rounded-2xl p-6 bg-gradient-to-r from-pink-600 to-violet-700 shadow-lg hover:scale-[1.01] transition text-left">
        <div class="text-xl font-semibold mb-1">🎓 Student Test by Code</div>
        <div class="text-pink-100 text-sm">Enter name + test code from teacher</div>
      </button>

      <button data-open="contactPanel" class="rounded-2xl p-6 bg-slate-800 border border-slate-700 shadow text-left">
        <div class="text-lg font-semibold">📬 Contact Admin/Developer</div>
      </button>

      <button data-open="adminPanel" class="rounded-2xl p-6 bg-slate-800 border border-red-700 shadow text-left">
        <div class="text-lg font-semibold">🛡️ Admin Panel</div>
      </button>
    </section>

    <section id="uploadPanel" class="panel hidden rounded-2xl border border-slate-700 bg-slate-800/70 p-4 mb-6">
      <h2 class="text-xl font-bold text-indigo-300 mb-3">Upload your own test</h2>
      <textarea id="uploadText" class="w-full h-48 p-3 rounded-lg bg-slate-900 border border-slate-700" placeholder="hello - salom\nwater - suv"></textarea>
      <div class="mt-3 flex gap-2">
        <button id="startUploadBtn" class="px-4 py-2 rounded-lg bg-indigo-600">Start uploaded test</button>
      </div>
    </section>

    <section id="codePanel" class="panel hidden rounded-2xl border border-slate-700 bg-slate-800/70 p-4 mb-6">
      <h2 class="text-xl font-bold text-pink-300 mb-3">Start teacher code-based test</h2>
      <div class="grid md:grid-cols-3 gap-2">
        <input id="studentName" class="p-3 rounded bg-slate-900 border border-slate-700" placeholder="Student name (required)"/>
        <input id="studentCode" class="p-3 rounded bg-slate-900 border border-slate-700 uppercase" placeholder="Test code"/>
        <button id="startCodeBtn" class="rounded bg-pink-600 px-4 py-2">Start test</button>
      </div>
    </section>

    <section id="contactPanel" class="panel hidden rounded-2xl border border-slate-700 bg-slate-800/70 p-4 mb-6">
      <h2 class="text-xl font-bold mb-3">Connect with coder</h2>
      <div class="flex flex-wrap gap-3">
        <a class="px-4 py-2 rounded bg-sky-600" href="https://t.me/XOSHIMJONOVUBAYDULLO" target="_blank" rel="noreferrer">Telegram</a>
        <a class="px-4 py-2 rounded bg-slate-700" href="https://github.com/Khanjan2004" target="_blank" rel="noreferrer">GitHub</a>
        <a class="px-4 py-2 rounded bg-emerald-700" href="mailto:ubaydulloxoshimjonov@gmail.com">Email</a>
      </div>
    </section>

    <section id="adminPanel" class="panel hidden rounded-2xl border border-red-800 bg-slate-800/70 p-4 mb-6">
      <h2 class="text-xl font-bold text-red-300 mb-3">Admin Panel</h2>
      <div id="adminLoginArea">
        <div class="grid md:grid-cols-2 gap-2">
          <input id="adminCodeInput" type="password" class="p-3 rounded bg-slate-900 border border-slate-700" placeholder="Admin panel secret code"/>
          <button id="adminLoginBtn" class="rounded bg-red-700 px-4 py-2">Login</button>
        </div>
        <p class="text-xs text-slate-400 mt-2">Admin secret is validated on server API, not hardcoded in frontend.</p>
      </div>

      <div id="adminBody" class="hidden mt-4">
        <div class="grid md:grid-cols-2 gap-2 mb-4">
          <input id="testName" class="p-2 rounded bg-slate-900 border border-slate-700" placeholder="Test name"/>
          <input id="testCode" class="p-2 rounded bg-slate-900 border border-slate-700 uppercase" placeholder="Test code (e.g. ABC123)"/>
          <input id="testTimer" type="number" class="p-2 rounded bg-slate-900 border border-slate-700" placeholder="Timer minute (optional)"/>
          <select id="testMode" class="p-2 rounded bg-slate-900 border border-slate-700">
            <option value="eng-uzb">ENG → UZB</option>
            <option value="uzb-eng">UZB → ENG</option>
          </select>
        </div>
        <textarea id="testWords" class="w-full h-32 p-3 rounded bg-slate-900 border border-slate-700" placeholder="word - tarjima"></textarea>
        <button id="createTestBtn" class="mt-2 px-4 py-2 rounded bg-emerald-700">Save test</button>

        <h3 class="mt-6 mb-2 font-bold">Tests & Statistics Board</h3>
        <div id="testsBoard" class="space-y-3"></div>
      </div>
    </section>

    <section id="quizSection" class="hidden rounded-2xl border border-slate-700 bg-slate-800/70 p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 id="quizTitle" class="text-xl font-bold"></h2>
        <div id="timerText" class="text-sm text-amber-300"></div>
      </div>
      <div class="mb-2 text-slate-300" id="quizProgress"></div>
      <div id="quizQuestion" class="text-3xl font-extrabold mb-4"></div>
      <input id="quizAnswer" class="w-full p-3 rounded bg-slate-900 border border-slate-700 mb-3" placeholder="Answer"/>
      <div class="flex gap-2">
        <button id="submitAnswerBtn" class="px-4 py-2 rounded bg-indigo-600">Check</button>
        <button id="nextQuestionBtn" class="px-4 py-2 rounded bg-slate-700 hidden">Next</button>
        <button id="finishQuizBtn" class="px-4 py-2 rounded bg-red-700">Finish</button>
      </div>
      <div id="quizFeedback" class="mt-3"></div>
    </section>
  </div>

  <script>
    const STORE_KEY = 'vocab-quiz-system-v1';
    const state = {
      tests: [],
      quiz: null,
      adminLogged: false,
      theme: localStorage.getItem('theme') || 'dark'
    };

    const el = (id) => document.getElementById(id);
    const byClass = (s) => document.querySelectorAll(s);

    function parseWords(text) {
      return text.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
        const cleaned = line.replace(/^\d+[\).\-\s]*/, '');
        const [a, ...rest] = cleaned.split(/\s*[-:;|=–—]\s*/);
        const b = rest.join(' - ');
        return a && b ? { eng: a.trim(), uzb: b.trim() } : null;
      }).filter(Boolean);
    }

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify({ tests: state.tests }));
    }

    function load() {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      state.tests = d.tests || [];
    }

    function showPanel(id) {
      byClass('.panel').forEach(x => x.classList.add('hidden'));
      el(id).classList.remove('hidden');
    }

    function levelFromPercent(pct) {
      if (pct < 50) return 'MIN';
      if (pct < 80) return 'NORMAL';
      return 'MAX';
    }

    function renderBoard() {
      const box = el('testsBoard');
      box.innerHTML = state.tests.map(t => {
        const allAttempts = (t.results || []).flatMap(r => r.attempts || []);
        const avg = allAttempts.length ? Math.round(allAttempts.reduce((s,a)=>s+a.percent,0)/allAttempts.length) : 0;
        return `
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-700">
            <div class="flex flex-wrap justify-between gap-2">
              <div>
                <div class="font-bold">${t.name}</div>
                <div class="text-xs text-slate-400">Code: ${t.code} | ${t.mode === 'eng-uzb' ? 'ENG→UZB':'UZB→ENG'} | ${t.open ? 'OPEN':'CLOSED'} | Timer: ${t.timerMin ? t.timerMin + ' min':'No limit'}</div>
              </div>
              <div class="flex gap-1">
                <button onclick="toggleOpen('${t.id}')" class="px-2 py-1 rounded bg-slate-700 text-xs">${t.open ? 'Close':'Open'}</button>
                <button onclick="switchMode('${t.id}')" class="px-2 py-1 rounded bg-indigo-700 text-xs">ENG/UZB</button>
              </div>
            </div>
            <div class="text-sm mt-2">Statistics: students ${t.results?.length || 0}, attempts ${allAttempts.length}, average ${avg}% (${levelFromPercent(avg)})</div>
          </div>`;
      }).join('') || '<div class="text-slate-400">No tests yet.</div>';
    }

    window.toggleOpen = (id) => {
      const t = state.tests.find(x => x.id === id); if (!t) return;
      t.open = !t.open; save(); renderBoard();
    };
    window.switchMode = (id) => {
      const t = state.tests.find(x => x.id === id); if (!t) return;
      t.mode = t.mode === 'eng-uzb' ? 'uzb-eng' : 'eng-uzb'; save(); renderBoard();
    };

    function startQuiz({name, words, mode, timerMin, code, studentName, testId}) {
      state.quiz = { name, words, mode, idx: 0, correct: 0, wrong: 0, timerMin, startAt: Date.now(), code, studentName, testId, done: false };
      el('quizSection').classList.remove('hidden');
      renderQuiz();
    }

    function renderQuiz() {
      const q = state.quiz;
      if (!q) return;
      const current = q.words[q.idx];
      const question = q.mode === 'eng-uzb' ? current.eng : current.uzb;
      const right = q.mode === 'eng-uzb' ? current.uzb : current.eng;
      el('quizTitle').textContent = `${q.name} (${q.mode === 'eng-uzb' ? 'ENG→UZB' : 'UZB→ENG'})`;
      el('quizProgress').textContent = `Question ${q.idx + 1}/${q.words.length} | Correct ${q.correct} | Wrong ${q.wrong}`;
      el('quizQuestion').textContent = question;
      const timer = q.timerMin ? Math.max(0, (q.timerMin*60000 - (Date.now() - q.startAt))) : null;
      el('timerText').textContent = timer === null ? 'No time limit' : `Remaining: ${Math.ceil(timer/1000)} sec`;
      if (timer === 0 && !q.done) finishQuiz();

      el('submitAnswerBtn').onclick = () => {
        const ans = el('quizAnswer').value.trim().toLowerCase();
        const ok = ans === right.trim().toLowerCase();
        if (ok) q.correct++; else q.wrong++;
        el('quizFeedback').innerHTML = ok
          ? `<div class='text-emerald-300'>Correct ✅</div>`
          : `<div class='text-red-300'>Wrong ❌ | correct answer: <b>${right}</b></div>`;
        el('nextQuestionBtn').classList.remove('hidden');
      };
      el('nextQuestionBtn').onclick = () => {
        el('quizAnswer').value = '';
        el('quizFeedback').innerHTML = '';
        el('nextQuestionBtn').classList.add('hidden');
        if (q.idx < q.words.length - 1) {
          q.idx++;
          renderQuiz();
        } else finishQuiz();
      };
      el('finishQuizBtn').onclick = () => finishQuiz();
    }

    function finishQuiz() {
      const q = state.quiz;
      if (!q || q.done) return;
      q.done = true;
      const percent = Math.round((q.correct / q.words.length) * 100);
      el('quizFeedback').innerHTML = `<div class='mt-2 p-3 rounded bg-slate-900 border border-slate-600'>Finished. Result: ${q.correct}/${q.words.length} (${percent}%) - Level ${levelFromPercent(percent)}</div>`;

      if (q.testId && q.code) {
        const t = state.tests.find(x => x.id === q.testId);
        if (t) {
          t.results = t.results || [];
          let student = t.results.find(r => r.name === q.studentName);
          if (!student) {
            student = { name: q.studentName, code: q.code, attempts: [] };
            t.results.push(student);
          }
          student.attempts.push({ percent, correct: q.correct, total: q.words.length, at: new Date().toLocaleString('uz-UZ') });
          save(); renderBoard();
        }
      }
    }

    setInterval(() => { if (state.quiz && !state.quiz.done) renderQuiz(); }, 1000);

    document.querySelectorAll('[data-open]').forEach(btn => btn.onclick = () => showPanel(btn.dataset.open));

    el('startUploadBtn').onclick = () => {
      const words = parseWords(el('uploadText').value);
      if (!words.length) return alert('No words parsed. Use format: eng - uzb');
      startQuiz({ name: 'Uploaded Test', words, mode: 'eng-uzb' });
    };

    el('startCodeBtn').onclick = () => {
      const studentName = el('studentName').value.trim();
      const code = el('studentCode').value.trim().toUpperCase();
      if (!studentName) return alert('Student name is required');
      if (!code) return alert('Code is required');
      const t = state.tests.find(x => x.code === code);
      if (!t) return alert('Test not found');
      if (!t.open) return alert('This test is closed by admin');
      startQuiz({ name: t.name, words: t.words, mode: t.mode, timerMin: t.timerMin, code: t.code, studentName, testId: t.id });
    };

    el('adminLoginBtn').onclick = async () => {
      const code = el('adminCodeInput').value;
      const r = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
      if (!r.ok) return alert('Invalid admin code');
      state.adminLogged = true;
      el('adminLoginArea').classList.add('hidden');
      el('adminBody').classList.remove('hidden');
    };

    el('createTestBtn').onclick = () => {
      const name = el('testName').value.trim();
      const code = el('testCode').value.trim().toUpperCase();
      const timerMin = Number(el('testTimer').value || 0);
      const mode = el('testMode').value;
      const words = parseWords(el('testWords').value);
      if (!name || !code || !words.length) return alert('Name, test code and words are required');
      if (state.tests.some(t => t.code === code)) return alert('Code already exists');
      state.tests.push({ id: crypto.randomUUID(), name, code, timerMin: timerMin > 0 ? timerMin : null, mode, open: true, words, results: [] });
      save(); renderBoard();
      ['testName','testCode','testTimer','testWords'].forEach(i => el(i).value = '');
    };

    el('themeBtn').onclick = () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      localStorage.setItem('theme', state.theme);
    };

    load();
    document.documentElement.classList.toggle('dark', state.theme === 'dark');
    renderBoard();
  </script>
</body>
</html>
